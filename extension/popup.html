<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'self'">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .header span {
      font-size: 20px;
    }

    .score-circle {
      text-align: center;
      margin: 20px 0;
    }

    .score-number {
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
    }

    .score-label {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .score-high { color: #22c55e; }
    .score-mid  { color: #f59e0b; }
    .score-low  { color: #ef4444; }

    .bar-container {
      background: #1e1e1e;
      border-radius: 999px;
      height: 8px;
      margin: 12px 0;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s ease;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin: 16px 0;
    }

    .stat {
      text-align: center;
      background: #1a1a1a;
      border-radius: 10px;
      padding: 10px 16px;
      flex: 1;
      margin: 0 4px;
    }

    .stat-number {
      font-size: 20px;
      font-weight: 700;
    }

    .stat-label {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .flags {
      margin-top: 16px;
    }

    .flag {
      background: #1a1a1a;
      border-left: 3px solid #ef4444;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 8px;
    }

    .confidence {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 12px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }

    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .loading {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 20px 0;
    }

    .no-reviews {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 20px 0;
      line-height: 1.6;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <span>🔍</span>
    <h1>Fake Review Detector</h1>
  </div>

  <div id="loading" class="loading hidden">Analyzing reviews...</div>
  
  <div id="no-reviews" class="no-reviews hidden">
    No reviews found on this page.<br>
    <small>Navigate to a product page first.</small>
  </div>

  <div id="results" class="hidden">
    <div class="score-circle">
      <div id="score-number" class="score-number">--</div>
      <div class="score-label">Trust Score</div>
    </div>

    <div class="bar-container">
      <div id="bar-fill" class="bar-fill" style="width: 0%"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div id="total-reviews" class="stat-number">--</div>
        <div class="stat-label">Reviews</div>
      </div>
      <div class="stat">
        <div id="fake-count" class="stat-number score-low">--</div>
        <div class="stat-label">Suspicious</div>
      </div>
    </div>

    <div id="flags" class="flags"></div>
    <div id="confidence" class="confidence"></div>
  </div>

  <button id="analyze-btn" class="btn">Analyze Reviews</button>

  <script src="popup.js"></script>
</body>
</html>
